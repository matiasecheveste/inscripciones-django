# Inscripciones a cursos — Matías Nicolás Echeveste Cardozo
name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: inscripciones
          POSTGRES_USER: inscripciones
          POSTGRES_PASSWORD: inscripciones
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U inscripciones" --health-interval 5s --health-retries 10
    env:
      POSTGRES_DB: inscripciones
      POSTGRES_USER: inscripciones
      POSTGRES_PASSWORD: inscripciones
      DJANGO_SECRET_KEY: clave-solo-para-ci-${{ github.run_id }}-0123456789abcdefghijklmnopqrstuvwxyz
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt ruff
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py test
        env:
          DJANGO_SSL_REDIRECT: "0" # el cliente de pruebas usa HTTP
